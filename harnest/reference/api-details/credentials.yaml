# Curated details for /harnest/reference/api/credentials. See task.yaml for the format.

CredentialProvider.resolve:
  params:
    request: The invocation and downstream audience that need a credential.

"*.resolve":
  params:
    audience: Downstream service the credential is for.
    scopes: Permissions requested for that service.

CredentialRequest:
  fields:
    audience: Downstream service the credential is for.
    scopes: Permissions requested for that service.
    principal: The authenticated caller.
