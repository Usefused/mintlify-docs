task:
  params:
    function: The decorated function. Filled in by bare `@task`; omit it when passing options. Needs a docstring
      and JSON-safe arguments.
    queue: Queue name, 1–64 characters, starting with a letter. Set it here, not on `.defer()`.
    max_retries: Retries after a failed run, from 0 to 100.
  example: |
    from harnest.task import task

    @task(queue="reports", max_retries=3)
    async def build_report(account_id: str) -> dict:
        """Build one account report."""
        return {"account_id": account_id}
TaskCallable.__call__:
  params:
    args: Positional arguments for the task function.
    kwargs: Keyword arguments for the task function.
  example: |
    # build_report is your @task function
    report = await build_report(account_id="acct_123")  # runs inline, no queue
TaskCallable.defer:
  params:
    args: Positional arguments for the task function.
    idempotency_key: Optional key, at most 512 characters, that deduplicates submissions.
    schedule_in: Optional delay in seconds before the task can run.
    kwargs: Keyword arguments for the task function, stored as strict JSON.
  example: |
    # build_report is your @task function
    handle = await build_report.defer(account_id="acct_123")
TaskHandle:
  fields:
    id: Opaque queue job ID.
    task_name: Registered task name.
  example: |
    from harnest.task import TaskHandle

    handle: TaskHandle = await build_report.defer(account_id="acct_123")
TaskStore.claim_tasks:
  params:
    queues: Queue names to claim work from.
    limit: Maximum number of jobs to claim in this batch.
TaskStore.finish_task:
  params:
    status: '`"completed"`, `"failed"`, or `"pending"` (retry later). `"pending"` requires `retry_at`.'
    result: JSON-safe result of a completed job.
    failure_code: Short failure category for a failed job.
    retry_at: When a `"pending"` job may run again, in UTC epoch seconds.
TaskStore.enqueue_task:
  params:
    record: The job to persist. An identical submission returns the existing job.
CompiledTask:
  params:
    name: Compiler-assigned task name.
    source: Source file of the task.
    definition: The task's queue and retry settings.
    authored: The decorated task function.
TaskCallable:
  params:
    definition: The task's queue and retry settings.
TaskRecord:
  fields:
    task_name: Registered task name.
    queue: Queue the job runs on.
    arguments: JSON-safe task arguments. Cleared when the job finishes.
    invocation: Invocation identity to restore when the job runs. Cleared when the job finishes.
    agent_permissions: Agent Runtime Principal permissions to restore, if any.
    trigger: What queued the job, such as `"agent"`, `"user"`, or `"cron"`.
    status: '`"pending"`, `"running"`, `"completed"`, `"failed"`, or `"cancelled"`.'
    scheduled_at: Earliest run time, in UTC epoch seconds.
    max_retries: Retry limit.
    attempt: Number of claims so far, starting at one.
    lease_expires_at: When the current lease expires, in UTC epoch seconds.
    result: Result of a completed job.
    failure_code: Failure category of a failed job.
    idempotency_key: Key that deduplicates submissions.
    created_at: When the job was queued, in UTC epoch seconds.
    updated_at: When the job last changed, in UTC epoch seconds.
    cron_schedule_id: ID of the schedule that queued it, for cron occurrences.
TaskDefinition:
  fields:
    function: The decorated function.
    queue: Queue name from `@task(queue=...)`.
    max_retries: Retry limit from `@task(max_retries=...)`.
safe_task_result:
  params:
    value: A task result to normalize to strict JSON.
PostgresTaskStore:
  params:
    dsn: PostgreSQL connection string.
    pool_options: Options for the `asyncpg` pool, such as `min_size` and `max_size`.
    setup_schema: Create Harnest's schema. Use `False` for a pre-provisioned schema.
