# Curated details for /harnest/reference/api/lifecycle. See task.yaml for the format.
# Hook decorators accept any function, so their handler arguments are written here.
# Shapes follow the runtime: interceptors get (context, value), error hooks get
# (context, error), and factories take no arguments.

agent.before:
  example: |
    from harnest import lifecycle

    @lifecycle.agent.before
    async def check_request(context, request):
        return context.next()

agent.after:
  example: |
    from harnest import lifecycle

    @lifecycle.agent.after
    async def record_result(context, result):
        return context.next()

agent.on_event:
  example: |
    from harnest import lifecycle

    @lifecycle.agent.on_event
    async def observe_event(context, event):
        return context.next()

agent.on_error:
  example: |
    from harnest import lifecycle

    @lifecycle.agent.on_error
    async def report_failure(context, error):
        return context.next()

