Finish:
  fields:
    result: The final result that ends the chain.
Next:
  fields:
    value: Replacement passed to the next stage, or unchanged.
LifecycleContext:
  fields:
    metadata: Public invocation metadata.
    attributes: Mutable values that hooks in the same invocation can share.
LifecycleRegistration:
  fields:
    phase: Lifecycle phase the decorator registers, such as `tool.before`.
    framework: Framework the registration is limited to, or `None` for both.
    name: Registration name, for named roles such as asset stores.
LifecycleListener:
  fields:
    phase: Lifecycle phase, such as `tool.before`.
    callback: The registered function.
    relative_path: Source file of the function, relative to the project.
    line: Line number of the function.
    function_name: Name of the function.
    framework: Framework the listener is limited to, or `None` for both.
    context_name: Name of the context resource it publishes, if any.
    registration_name: Registration name, for named roles.
ModelCallRequest:
  fields:
    model: Model ID, when known.
    messages: Messages sent to the model.
ModelCallResponse:
  fields:
    text: Visible model output.
ModelMessage:
  fields:
    role: Message role, such as `user` or `assistant`.
    text: Message text.
LifecycleCoverage:
  fields:
    mode: '`"managed"` or `"advanced"`.'
    application: How fully Harnest governs application startup and shutdown.
    http: How fully Harnest governs HTTP hooks.
    invocation: How fully Harnest governs invocation hooks.
    credentials: How fully Harnest governs credential resolution.
    session: How fully Harnest governs session hooks.
    assets: How fully Harnest governs asset access.
    model: How fully Harnest governs model hooks.
    tool: How fully Harnest governs tool hooks.
    mcp: How fully Harnest governs MCP hooks.
    agent: How fully Harnest governs agent hooks.
    subagent: How fully Harnest governs SubAgent hooks.
    checkpoint: How fully Harnest governs checkpointing.
